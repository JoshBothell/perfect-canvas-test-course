key: unit1-foundations
title: "📜 Unit 1: Copyright Foundations"
published: true
prerequisites: [orientation]
tests: [prerequisite module, one of every basic item & submission type, completion requirements of every kind]
items:
  - type: subheader
    title: "📖 Learn"
  - type: page
    key: unit1-overview
    title: "Unit 1 Overview: What Copyright Protects"
    body: {file: pages/unit1-overview.html}
    requirement: must_view
    tests: [unit guide, links to pages/assignments/quizzes/discussions/files, image gallery from Files]
  - type: page
    key: collection-before-1800
    title: "The Collection, Part I: Works Before 1800"
    body: {file: pages/collection-before-1800.html}
    requirement: must_view
    indent: 1
    tests: [151-row data table with 151 image references]
  - type: page
    key: term-grid
    title: "Term Arithmetic Grid (life + N)"
    body: {file: pages/term-grid.html}
    requirement: must_mark_done
    indent: 1
    tests: [must_mark_done requirement, 17x17 generated table]
  - type: file
    path: documents/term-chart.pdf
    title: "U.S. Copyright Term Chart (PDF)"
    indent: 1
    requirement: must_view
    tests: [Attachment module item, PDF with usage rights, must_view on a file]
  - type: url
    key: copyright-office-duration
    title: "U.S. Copyright Office: Duration of Copyright (new tab)"
    url: https://www.copyright.gov/circs/circ15a.pdf
    new_tab: true
    indent: 1
  - type: url
    key: wikipedia-copyright-clause
    title: "Wikipedia: Copyright Clause (embedded)"
    url: https://en.wikipedia.org/wiki/Copyright_Clause
    indent: 1

  - type: subheader
    title: "✍️ Practice: one of every submission type"
  - type: assignment
    key: choose-your-first-work
    title: "Choose Your First Public-Domain Work"
    group: memos
    points: 10
    submission_types: [online_text_entry]
    rubric: status-memo
    rubric_use_for_grading: true
    due: "+5d@23:59"
    description: |
      <p>Pick one of the three works below and write a short status memo (150–300 words): who made it, when, and why it is in the public domain today.</p>
      <p>{% for e in catalog_group(1)[:3] %}{{ entry_image(e) }} {% endfor %}</p>
      <p>Graded with the <em>Status Memo Rubric</em> (rubric used for grading). The seeder adds a section-specific due date for Section B.</p>
    requirement: must_submit
    tests: [online_text_entry, rubric used for grading, outcome-aligned criterion, section override (seeder)]
  - type: assignment
    key: pd-image-in-the-wild
    title: "Public-Domain Image in the Wild"
    group: memos
    points: 10
    submission_types: [online_upload]
    allowed_extensions: [png, jpg, jpeg, pdf]
    due: "+6d@17:00"
    description: "<p>Upload a public-domain image you found in a museum open-access collection (PNG, JPG or PDF only).</p>"
    tests: [online_upload, allowed_extensions restriction]
  - type: assignment
    key: catalog-record-url
    title: "Catalog Record URL"
    group: memos
    points: 5
    submission_types: [online_url]
    due: "-2d@23:59"
    description: "<p>Submit the URL of an online catalog record that shows a work's rights status. <strong>This one is past due</strong>, so the late policy applies.</p>"
    tests: [online_url, past due date, late policy]
  - type: assignment
    key: read-a-poem-aloud
    title: "Read a Public-Domain Poem Aloud"
    group: memos
    points: 5
    submission_types: [media_recording]
    due: "+8d@23:59"
    description: "<p>Record yourself reading a short public-domain poem using the Canvas media recorder.</p>"
    tests: [media_recording]
  - type: assignment
    key: annotate-copyright-clause
    title: "Annotate the Copyright Clause & 17 U.S.C. § 102"
    group: memos
    points: 10
    submission_types: [student_annotation]
    annotatable_file: documents/copyright-clause-annotatable.pdf
    due: "+9d@23:59"
    description: "<p>Use Canvas's annotation tools to highlight and comment directly on the statute excerpts PDF.</p>"
    tests: [student_annotation with annotatable attachment]
  - type: assignment
    key: status-report-any-format
    title: "Public Domain Status Report (any format)"
    group: memos
    points: 10
    submission_types: [online_text_entry, online_url, online_upload, media_recording]
    due: "+10d@23:59"
    description: "<p>Submit in whichever format you like. Allowed: text, URL, file upload or media.</p>"
    tests: [multiple submission types on one assignment]
  - type: assignment
    key: card-catalog-hunt
    title: "In-Class Card Catalog Scavenger Hunt"
    group: practice
    points: 5
    submission_types: [on_paper]
    due: "+4d@10:00"
    description: "<p>In-person activity: graded on paper; nothing to submit online.</p>"
    tests: [on_paper submission type]
  - type: assignment
    key: reading-room-checkin
    title: "Reading Room Check-in"
    group: practice
    points: 0
    grading_type: not_graded
    submission_types: [none]
    description: "<p>No submission: the instructor checks you in at the Reading Room desk.</p>"
    tests: [submission type none, not_graded, no due date]

  - type: subheader
    title: "💬 Discuss"
  - type: discussion
    key: idea-vs-expression
    title: "Idea or Expression? Where Is the Line?"
    discussion_type: threaded
    require_initial_post: true
    allow_rating: true
    message: |
      <p>Copyright protects expression, not ideas. Pick one example and argue which side of the line it falls on. Use the term arithmetic in {{ a_page('term-grid') }} if your example involves dates.</p>
      <p>You must post before you can see replies.</p>
    graded:
      group: seminar
      points: 10
      due: "+7d@23:59"
      rubric: argument
    requirement: must_contribute
    tests: [graded discussion, require_initial_post, ratings, rubric with free-form comments + ignore_for_scoring criterion]

  - type: subheader
    title: "📝 Assess"
  - type: quiz
    key: name-that-work
    indent: 1
    tests: [practice quiz (ungraded), unlimited attempts, masked images in questions, 3 questions randomized per build (--seed), question group drawing 3 of 386 from a bank on every attempt]
  - type: quiz
    key: copyright-basics-quiz
    requirement: min_score
    min_score: 6
    tests: [graded Classic quiz, MC/TF/multiple answers/short answer/matching, answer + question feedback, min_score requirement, bonus bank draw mixed with fixed questions]
