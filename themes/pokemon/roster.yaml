  - {assignment: choose-your-starter, user: misty, rubric: {Accuracy: 4, "Observation Detail": 4, Presentation: 2}, comment: "Excellent 💧"}
  - {assignment: route-1-field-notes, user: ash, grade: "4", comment: "Late, but solid."}
  - {assignment: route-1-field-notes, user: brock, excuse: true, comment: "Excused: Gym duties."}
  - {assignment: game-boy-in-class, user: ash, grade: "5"}
  - {assignment: game-boy-in-class, user: gary, grade: "0", comment: "Forgot it at home (on_paper grade entered by teacher)."}
  - {assignment: johto-letter-grade, user: misty, grade: "Elite Four"}
  - {assignment: pokegear-setup, user: brock, grade: "complete"}
  - {assignment: johto-gpa, user: gary, grade: "3.5"}
