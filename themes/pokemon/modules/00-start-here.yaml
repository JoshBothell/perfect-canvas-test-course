key: start-here
title: "🏠 Orientation: Pallet Town"
published: true
items:
  - type: subheader
    title: "👋 Welcome"
  - type: page
    key: welcome
    title: "Welcome, Trainer!"
    front_page: true
    body: {file: pages/welcome.html}
    requirement: must_view
    tests: [front page, default_view=wiki, rich HTML, internal links of every type]
  - type: page
    key: how-this-course-works
    title: "How This Course Works"
    body: {file: pages/how-this-course-works.html}
    requirement: must_view
    indent: 1
    tests: [indented module item, must_view requirement]
  - type: page
    key: course-tour
    title: "Course Tour (video, audio & captions)"
    body: {file: pages/course-tour.html}
    requirement: must_view
    indent: 1
    tests: [HTML5 video + audio from course files, VTT caption tracks (en/es)]
  - type: discussion
    key: introductions
    title: "Introduce Yourself & Your Partner Pokémon"
    discussion_type: threaded
    pinned: true
    allow_rating: true
    message: |
      <p>Tell us your name, your hometown, and which Pokémon you'd pick as a lifelong partner (and why!).</p>
      <p>Bonus: attach a picture of your favorite {{ a_file('images/capture-ball.svg', 'capture ball') }}.</p>
    requirement: must_contribute
    tests: [ungraded pinned discussion, must_contribute requirement, discussion ratings]
  - type: subheader
    title: "🧰 Tools & Reference"
  - type: page
    key: kitchen-sink
    title: "RCE Kitchen Sink (every content element)"
    body: {file: pages/kitchen-sink.html}
    tests: [headings/lists/tables/code/details/blockquote, equation image, iframe embed, RTL + CJK + emoji, long unbroken strings]
  - type: file
    path: documents/trainer-handbook.docx
    title: "Trainer Handbook (.docx)"
    tests: [Attachment module item, DOCX preview]
  - type: url
    key: canvas-student-guide
    title: "Canvas Student Guide (opens in new tab)"
    url: https://community.canvaslms.com/t5/Student-Guide/tkb-p/student
    new_tab: true
    tests: [ExternalUrl new_tab=true]
  - type: url
    key: wikipedia-pokemon
    title: "Pokémon on Wikipedia (embedded external URL)"
    url: https://en.wikipedia.org/wiki/Pok%C3%A9mon
    new_tab: false
    tests: [ExternalUrl new_tab=false (iframe), percent-encoded URL]
