key: name-that-work
title: "Name That Work! (Practice)"
quiz_type: practice_quiz
allowed_attempts: -1
shuffle_answers: true
description: |
  <p>Ungraded practice quiz with unlimited attempts. Every question shows a pixelated public-domain artwork (or a title-hidden museum label when the build was offline).</p>
  <p>Questions 1–3 are picked at random each time the course is <em>built</em>. Questions 4–6 are drawn at random from the 386-question <em>Name That Work Bank</em> every time the quiz is <em>taken</em>, so each retake is different.</p>
questions:
  # 3 random pre-1800 works, re-picked on every build (reproducible with `cc build --seed N`)
  - type: generated
    generator: identify
    catalog_group: 1
    count: 3
  # Canvas draws 3 fresh questions from the bank on every attempt
  - type: group
    name: "Random mystery works (3 of 386, re-drawn each attempt)"
    pick: 3
    points_per_item: 1
    bank: name-that-work-bank
