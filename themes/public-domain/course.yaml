# Public Domain Academy: course-level settings and course-wide objects.
# Structure and every setting mirror themes/pokemon/course.yaml (same test matrix); only text differs.
# Relative dates ("+7d@23:59") resolve against the build anchor (default: today) in time_zone.

title: "Public Domain Academy"
course_code: PDA-101
time_zone: America/Denver
locale: en
start: "-30d@00:00"
end: "+120d@23:59"
image: images/course-card.png
banner_image: images/course-banner.png
default_view: wiki                 # front page = "Welcome to Public Domain Academy"
default_grading_standard: case-outcome-tiers
group_weighting_scheme: percent    # weighted assignment groups
default_wiki_editing_roles: teachers
license: private
post_manually: false

flags:
  allow_student_discussion_topics: true
  allow_student_discussion_editing: true
  allow_student_forum_attachments: true
  allow_student_organized_groups: true
  show_announcements_on_home_page: true
  home_page_announcement_limit: 3
  hide_final_grade: false
  hide_distribution_graphs: false
  restrict_student_future_view: false
  restrict_student_past_view: false
  restrict_enrollments_to_course_dates: false
  lock_all_announcements: false
  usage_rights_required: false
  syllabus_course_summary: true
  filter_speed_grader_by_student_group: false

# Course navigation order. "lti:<tool>" entries only appear when themes/public-domain/lti.yaml defines the tool.
tabs:
  - home
  - modules
  - announcements
  - syllabus
  - assignments
  - discussions
  - quizzes
  - grades
  - people
  - pages
  - files
  - groups
  - lti:primary
  - {tab: outcomes, hidden: true}
  - {tab: rubrics, hidden: true}
  - {tab: collaborations, hidden: true}
  - {tab: conferences, hidden: true}

late_policy:
  late_deduction_enabled: true
  late_deduction: 10.0
  late_interval: day
  minimum_percent_enabled: true
  minimum_percent: 50.0
  missing_deduction_enabled: false
  missing_deduction: 0.0

assignment_groups:
  - {key: memos,     title: "Research Memos",               weight: 25, rules: {drop_lowest: 1}}
  - {key: quizzes,   title: "Quizzes",                      weight: 25}
  - {key: seminar,   title: "Seminar (Discussions)",        weight: 15}
  - {key: exams,     title: "Exams",                        weight: 30, rules: {drop_lowest: 1, never_drop: [unit3-exam-section-b]}}
  - {key: extra,     title: "Extra Credit",                 weight: 5}
  - {key: practice,  title: "Practice & Ungraded",          weight: 0}

grading_standards:
  - key: case-outcome-tiers
    title: "Case Outcome Tiers (letter scheme)"
    data:
      - ["Landmark", 0.93]
      - ["Precedent", 0.85]
      - ["Persuasive", 0.75]
      - ["Dicta", 0.65]
      - ["Overruled", 0.0]
  - key: classic-letter
    title: "Classic A–F"
    data:
      - ["A", 0.94]
      - ["A-", 0.90]
      - ["B+", 0.87]
      - ["B", 0.84]
      - ["B-", 0.80]
      - ["C+", 0.77]
      - ["C", 0.74]
      - ["C-", 0.70]
      - ["D", 0.60]
      - ["F", 0.0]
  - key: gpa-4
    title: "GPA 4.0 Scale (points-based)"
    points_based: true
    scaling_factor: 4.0
    data:
      - ["4.0", 0.95]
      - ["3.5", 0.875]
      - ["3.0", 0.75]
      - ["2.5", 0.625]
      - ["2.0", 0.5]
      - ["1.0", 0.25]
      - ["0.0", 0.0]

outcomes:
  group:
    key: public-domain-competencies
    title: "Public Domain Competencies"
    description: "Course-level outcome group. Each outcome uses a different calculation method."
  outcomes:
    - key: term-calculation
      title: "PD.1 Term Calculation"
      description: "<p>Calculates when a work's copyright term ends under the applicable rule.</p>"
      calculation_method: decaying_average
      calculation_int: 65
      points_possible: 4
      mastery_points: 3
      ratings: &ratings4
        - {description: "Exceeds Mastery", points: 4}
        - {description: "Mastery", points: 3}
        - {description: "Near Mastery", points: 2}
        - {description: "Below Mastery", points: 1}
        - {description: "No Evidence", points: 0}
    - key: status-determination
      title: "PD.2 Status Determination"
      description: "<p>Determines a work's public-domain status and explains the reasoning.</p>"
      calculation_method: highest
      points_possible: 4
      mastery_points: 3
      ratings: *ratings4
    - key: source-verification
      title: "PD.3 Source & Licence Verification"
      description: "<p>Finds and records reliable evidence of a work's source and licence.</p>"
      calculation_method: n_mastery
      calculation_int: 2
      points_possible: 4
      mastery_points: 3
      ratings: *ratings4
    - key: legal-communication
      title: "PD.4 Legal Communication"
      description: "<p>Communicates legal analysis clearly, accurately and respectfully.</p>"
      calculation_method: latest
      points_possible: 4
      mastery_points: 3
      ratings: *ratings4

rubrics:
  - key: status-memo
    title: "Status Memo Rubric"
    criteria:
      - description: "Accuracy"
        long_description: "Dates, terms and the governing rule are correct."
        points: 4
        outcome: source-verification
        ratings:
          - {description: "Exceeds Mastery", points: 4}
          - {description: "Mastery", points: 3}
          - {description: "Near Mastery", points: 2}
          - {description: "Below Mastery", points: 1}
          - {description: "No Evidence", points: 0}
      - description: "Research Detail"
        long_description: "Cites the source record, the licence evidence and at least one independent check."
        points: 4
        ratings:
          - {description: "Thorough", points: 4}
          - {description: "Solid", points: 3}
          - {description: "Thin", points: 1}
          - {description: "Missing", points: 0}
      - description: "Presentation"
        points: 2
        use_range: true
        ratings:
          - {description: "Polished", points: 2}
          - {description: "Readable", points: 1}
          - {description: "Hard to read", points: 0}
  - key: argument
    title: "Legal Argument (free-form comments)"
    free_form_criterion_comments: true
    criteria:
      - description: "Rule Application"
        points: 4
        outcome: term-calculation
        ratings:
          - {description: "Exceeds Mastery", points: 4}
          - {description: "Mastery", points: 3}
          - {description: "Near Mastery", points: 2}
          - {description: "Below Mastery", points: 1}
          - {description: "No Evidence", points: 0}
      - description: "Justification"
        points: 5
        ratings:
          - {description: "Full marks", points: 5}
          - {description: "No marks", points: 0}
      - description: "Participation note (not scored)"
        points: 1
        ignore_for_scoring: true
        ratings:
          - {description: "Noted", points: 1}
          - {description: "-", points: 0}
  - key: moot-court
    title: "Moot Court Judging (hidden score total)"
    hide_score_total: true
    criteria:
      - description: "Issue"
        points: 10
        ratings: &bench
          - {description: "Compelling", points: 10}
          - {description: "Sound", points: 6}
          - {description: "Unclear", points: 2}
      - description: "Rule"
        points: 10
        ratings: *bench
      - description: "Application"
        points: 10
        ratings: *bench
      - description: "Conclusion"
        points: 10
        ratings: *bench
      - description: "Advocacy"
        points: 10
        ratings: *bench

# Files: per-file metadata (anything not listed here is a plain, visible file).
folders:
  "Instructor's Archive": {hidden: true, locked: true}
  "media": {unlock_at: "-30d@00:00"}
files:
  "Instructor's Archive/answer-key.pdf": {locked: true, hidden: true}
  "documents/term-chart.pdf":
    usage_rights: {use_justification: own_copyright, legal_copyright: "(c) Public Domain Academy test fixture", license: private}
  "data/renewal-search-log-10k.csv": {display_name: "Renewal Search Log (10,000 rows).csv"}
  "data/pd_calculator.py": {lock_at: "+60d@23:59"}

syllabus: {file: pages/syllabus.html}

events:
  - key: office-hours
    title: "Professor Van Helsing's Office Hours"
    description: "<p>Weekly recurring event (6-week series). Drop in with questions about copyright terms.</p>"
    start: "-7d@15:00"
    end: "-7d@16:30"
    repeat_weekly: 6
  - key: public-domain-day-party
    title: "Public Domain Day Watch Party 🎉"
    description: "<p>All-day event.</p>"
    start: "+3d"
    all_day: true
  - key: archive-weekend
    title: "Archive Research Weekend"
    description: "<p>Multi-day event (Friday 17:00 through Sunday 20:00).</p>"
    start: "+9d@17:00"
    end: "+11d@20:00"
  - key: dst-night
    title: "Midnight Records Search (spans the DST change)"
    description: "<p>Starts before and ends after the next daylight-saving transition. Duration depends on correct TZ handling.</p>"
    start: "dst_next@00:00"
    end: "dst_next@04:00"

announcements:
  - key: welcome
    title: "Welcome to Public Domain Academy!"
    message: |
      <p>Your research begins in <strong>the Reading Room</strong>. Start with {{ a_page('welcome') }} and then open {{ a_page('how-this-course-works') }}.</p>
      <p>Office hours are on the calendar every week.</p>
  - key: archive-closure
    title: "Archive closure: comments locked"
    locked: true
    message: "<p>Comments on this announcement are locked. Use it to test read-only announcement replies.</p>"
  - key: future-unit3
    title: "Unit 3 opens soon (delayed post)"
    delayed_post_at: "+14d@08:00"
    message: "<p>This announcement is scheduled. It should not be visible to students until it posts.</p>"

pages:
  - key: developer-notes
    title: "🧪 Developer Notes: Test Matrix"
    published: false
    body: {file: pages/developer-notes.html}
  - key: orphan-page
    title: "Orphan Page (not in any module)"
    body: "<p>This page is published but not placed in any module, so it is only reachable from the Pages index or a direct link. Useful for testing content discovery that relies only on Modules.</p>"
